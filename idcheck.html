<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تفعيل الكي — AFRICA HACKS 🇲🇦</title>
  <link rel="icon" type="image/png" href="logos/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root{--gold:#FFB800;--gold-soft:#FFCC33;--red:#E63946;--green:#22C55E;--bg:#0a0805;--panel:#141009;--panel-2:#1a1510;--border:#2a2018;--border-gold:rgba(255,184,0,0.3);--text:#fff;--text-dim:#a8a09a;--text-muted:#6b635c;--wa:#25d366}
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    body{font-family:'Poppins','Cairo',sans-serif;background:var(--bg);color:var(--text);line-height:1.55;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;overflow-x:hidden}
    body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 50% 0%,rgba(255,184,0,0.08) 0%,transparent 50%);pointer-events:none;z-index:0}
    .card{width:100%;max-width:440px;position:relative;z-index:1;background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--border);border-radius:24px;padding:32px 24px;box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 0 1px rgba(255,184,0,0.05) inset;animation:cardIn .5s cubic-bezier(.16,1,.3,1)}
    @keyframes cardIn{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
    .card-head{text-align:center;margin-bottom:24px}
    .head-logo{font-size:40px;margin-bottom:8px}
    .card-head h1{font-family:'Poppins',sans-serif;font-weight:900;font-size:22px;letter-spacing:-.02em;margin-bottom:4px}
    .card-head h1 .gold{color:var(--gold)}
    .card-head p{font-size:12px;color:var(--text-muted);font-weight:600}
    .mode-selector{display:flex;gap:10px;margin-bottom:22px;padding:5px;background:rgba(0,0,0,.4);border:1px solid var(--border);border-radius:12px}
    .mode-btn{flex:1;padding:12px;border-radius:8px;font-family:inherit;font-size:13px;font-weight:800;background:transparent;color:var(--text-dim);border:none;cursor:pointer;transition:all .2s ease}
    .mode-btn.active{background:linear-gradient(135deg,var(--gold),var(--gold-soft));color:#000;box-shadow:0 2px 8px rgba(255,184,0,0.3)}
    .mode-btn.active.crash-mode{background:linear-gradient(135deg,var(--red),#cc0028);color:white}
    .form-label{display:block;font-size:11px;font-weight:800;color:var(--text-muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
    .input-wrap{position:relative;margin-bottom:18px}
    .form-input{width:100%;padding:15px 16px;background:rgba(0,0,0,.4);border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:15px;font-weight:600;border-radius:12px;outline:none;transition:all .2s ease;text-align:center;letter-spacing:.04em}
    .form-input:focus{border-color:var(--gold);background:rgba(0,0,0,.6);box-shadow:0 0 0 3px rgba(255,184,0,0.1)}
    .form-input::placeholder{color:var(--text-muted);font-weight:500;letter-spacing:.02em}
    .status-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:16px;font-weight:900;transition:color .2s}
    .status-icon.valid{color:var(--green)}
    .status-icon.invalid{color:var(--red)}
    .platforms{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
    .plat-btn{background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:10px;padding:10px 4px;cursor:pointer;display:flex;align-items:center;justify-content:center;min-height:48px;transition:all .15s ease}
    .plat-btn img{max-width:100%;max-height:22px;filter:grayscale(1) opacity(.4);transition:all .15s}
    .plat-btn:hover{border-color:var(--border-gold)}
    .plat-btn.active{border-color:var(--gold);background:rgba(255,184,0,0.08);box-shadow:0 0 0 1px var(--gold),0 0 15px rgba(255,184,0,0.2)}
    .plat-btn.active img{filter:none;opacity:1}
    .plat-btn.other-btn{font-size:11px;font-weight:900;color:var(--text-dim);letter-spacing:.05em}
    .plat-btn.other-btn.active{color:var(--gold)}
    .btn-submit{width:100%;padding:17px;border-radius:12px;font-family:inherit;font-size:15px;font-weight:900;background:linear-gradient(135deg,var(--gold),var(--gold-soft));color:#000;border:none;cursor:pointer;box-shadow:0 6px 20px rgba(255,184,0,0.35);letter-spacing:.05em;transition:all .15s ease;margin-top:6px}
    .btn-submit:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 28px rgba(255,184,0,0.5)}
    .btn-submit:disabled{background:rgba(255,255,255,0.05);color:var(--text-muted);cursor:not-allowed;box-shadow:none}
    #loader{display:none;text-align:center;padding:20px 0}
    #loader.active{display:block}
    .loader-bar{width:100%;height:6px;background:rgba(0,0,0,.5);border-radius:3px;overflow:hidden;margin:16px 0}
    .loader-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--gold-soft));box-shadow:0 0 12px rgba(255,184,0,0.5);transition:width .3s ease;border-radius:3px}
    .loader-text{font-size:12px;font-weight:700;color:var(--gold);letter-spacing:.05em;margin-bottom:4px}
    .loader-time{font-size:10px;color:var(--text-muted);margin-top:8px}
    #success{display:none;text-align:center;padding:20px 0;animation:cardIn .4s ease}
    #success.active{display:block}
    .success-check{font-size:56px;margin-bottom:12px;animation:bounce .6s ease}
    @keyframes bounce{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
    .success-title{font-size:20px;font-weight:900;color:var(--green);margin-bottom:8px}
    .success-sub{font-size:12px;color:var(--text-dim);margin-bottom:20px}
    .success-sub strong{color:var(--text);font-weight:800}
    .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--text-muted);font-size:12px;font-weight:600;text-decoration:none;margin-top:16px}
    .back-link:hover{color:var(--gold)}
    body.theme-apple{--accent:var(--green)}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
    .shake{animation:shake .35s ease}
    @media (max-width:420px){.card{padding:26px 18px}.platforms{grid-template-columns:repeat(3,1fr)}}
  </style>
</head>
<body>

<div class="card">
  <div class="card-head">
    <div class="head-logo">🔑</div>
    <h1>تفعيل <span class="gold">السكريبت</span></h1>
    <p>دخل الـ ID و الـ Key ديالك</p>
  </div>

  <div id="mainForm">
    <div class="mode-selector">
      <button class="mode-btn active crash-mode" data-mode="crash" id="btnCrash">🚀 Crash</button>
      <button class="mode-btn" data-mode="apple" id="btnApple">🍎 Apple</button>
    </div>

    <label class="form-label">🆔 الـ ID ديال الحساب (أرقام فقط)</label>
    <div class="input-wrap">
      <input type="text" id="userId" class="form-input" placeholder="مثلاً: 123456789" inputmode="numeric" autocomplete="off">
      <span class="status-icon" id="userIdStatus">●</span>
    </div>

    <label class="form-label">🎫 الـ License Key</label>
    <div class="input-wrap">
      <input type="text" id="licenseKey" class="form-input" placeholder="AFRICA-XXXX-XXXX" autocomplete="off" style="text-transform:uppercase">
    </div>

    <label class="form-label">🏢 اختار السيت</label>
    <div class="platforms" id="platforms">
      <div class="plat-btn active" data-plat="1xbet"><img src="logos/1xbet.png" alt="1xbet"></div>
      <div class="plat-btn" data-plat="1win"><img src="logos/1win.png" alt="1win"></div>
      <div class="plat-btn" data-plat="melbet"><img src="logos/melbet.png" alt="Melbet"></div>
      <div class="plat-btn" data-plat="betwinner"><img src="logos/msport.png" alt="Msport"></div>
      <div class="plat-btn" data-plat="bet9ja"><img src="logos/bet9ja.png" alt="Bet9ja"></div>
      <div class="plat-btn" data-plat="betway"><img src="logos/betway.png" alt="Betway"></div>
      <div class="plat-btn" data-plat="linebet"><img src="logos/linebet.png" alt="Linebet"></div>
      <div class="plat-btn" data-plat="sporty"><img src="logos/sportybet.png" alt="SportyBet"></div>
      <div class="plat-btn other-btn" data-plat="other">أخرى</div>
    </div>

    <button class="btn-submit" id="btnSubmit" disabled>🚀 تفعيل دابا</button>

    <div style="text-align:center;margin-top:16px">
      <a href="index.html" class="back-link">← رجع للرئيسية</a>
    </div>
  </div>

  <div id="loader">
    <div class="loader-text" id="loaderText">كنتواصلو مع السيرفر...</div>
    <div class="loader-bar"><div class="loader-fill" id="loaderFill"></div></div>
    <div class="loader-time" id="loaderTime">0s / 30s</div>
  </div>

  <div id="success">
    <div class="success-check">✅</div>
    <div class="success-title">تفعل!</div>
    <div class="success-sub" id="successSub">كنفتحو ليك السكريبت...</div>
  </div>
</div>

<script>
  let mode='crash', platform='1xbet', redirecting=false;
  const userIdEl=document.getElementById('userId');
  const userIdStatus=document.getElementById('userIdStatus');
  const licenseEl=document.getElementById('licenseKey');
  const btnSubmit=document.getElementById('btnSubmit');

  function validate(){
    const idOk=/^\d{3,}$/.test(userIdEl.value.trim());
    const keyOk=licenseEl.value.trim().length>=6;
    userIdStatus.textContent=userIdEl.value.trim()?(idOk?'✓':'✗'):'●';
    userIdStatus.className='status-icon'+(userIdEl.value.trim()?(idOk?' valid':' invalid'):'');
    btnSubmit.disabled=!(idOk&&keyOk);
    return idOk&&keyOk;
  }
  userIdEl.addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,15);validate()});
  licenseEl.addEventListener('input',validate);

  document.querySelectorAll('.mode-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      mode=btn.dataset.mode;
      document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active','crash-mode'));
      btn.classList.add('active');
      if(mode==='crash')btn.classList.add('crash-mode');
      document.body.classList.toggle('theme-apple',mode==='apple');
    });
  });

  document.querySelectorAll('.plat-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.plat-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      platform=btn.dataset.plat;
      if(platform==='other'){
        const custom=prompt('دخل اسم السيت:');
        if(custom)platform=custom;
        else btnSubmit.disabled=true;
      }
    });
  });

  btnSubmit.addEventListener('click',()=>{
    if(!validate()||redirecting)return;
    document.getElementById('mainForm').style.display='none';
    document.getElementById('loader').classList.add('active');
    const waitTime=8+Math.floor(Math.random()*4);
    let elapsed=0;
    const phases=[
      'كنتواصلو مع السيرفر...',
      'كنتحققو من الـ Key...',
      'كنربطو الحساب...',
      'كنحضرو السكريبت...',
      'على وشك يالاه!'
    ];
    const loaderText=document.getElementById('loaderText');
    const loaderFill=document.getElementById('loaderFill');
    const loaderTime=document.getElementById('loaderTime');
    const interval=setInterval(()=>{
      elapsed++;
      loaderTime.textContent=`${elapsed}s / ${waitTime}s`;
      loaderFill.style.width=`${(elapsed/waitTime)*100}%`;
      const phaseIdx=Math.min(Math.floor((elapsed/waitTime)*phases.length),phases.length-1);
      loaderText.textContent=phases[phaseIdx];
      if(elapsed>=waitTime){clearInterval(interval);showSuccess()}
    },1000);
  });

  function showSuccess(){
    document.getElementById('loader').classList.remove('active');
    document.getElementById('success').classList.add('active');
    document.getElementById('successSub').innerHTML=`<strong>${mode==='crash'?'Crash':'Apple'} · ${platform}</strong><br>كنفتحو ليك السكريبت...`;
    redirecting=true;
    localStorage.setItem('selected_node',platform);
    localStorage.setItem('script_mode',mode);
    // ✅ FIXED: redirect to TOOL pages, not marketing pages
    setTimeout(()=>{window.location.href=mode==='crash'?'predictor.html':'aofpredictor.html'},1800);
  }

  const urlParams=new URLSearchParams(window.location.search);
  if(urlParams.get('product')==='apple'){document.getElementById('btnApple').click()}
</script>

</body>
</html>
